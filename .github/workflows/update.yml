name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&bg_color=0D1117
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&bg_color=0D1117
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      parallel:
        - name: Generate pin card (yukihana-project/YukihanaOS)
          uses: stats-organization/github-readme-stats-action@v2
          with:
            card: pin
            options: username=yukihana-project&repo=YukihanaOS&bg_color=0D1117
            path: profile/pin-stats-yukihana-project-yukihanaos.svg
            token: ${{ secrets.GITHUB_TOKEN }}
        - name: Generate pin card (zimavi/Shirabe.Client)
          uses: stats-organization/github-readme-stats-action@v2
          with:
            card: pin
            options: username=zimavi&repo=Shirabe.Client&bg_color=0D1117
            path: profile/pin-stats-zimavi-shirabe-client.svg
            token: ${{ secrets.GITHUB_TOKEN }}
        - name: Generate pin card (zimavi/oxygen)
          uses: stats-organization/github-readme-stats-action@v2
          with:
            card: pin
            options: username=zimavi&repo=oxygen&bg_color=0D1117
            path: profile/pin-stats-zimavi-oxygen.svg
            token: ${{ secrets.GITHUB_TOKEN }}

- name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
